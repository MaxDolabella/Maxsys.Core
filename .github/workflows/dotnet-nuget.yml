# Publicação de pacotes NuGet
# Dispara ao criar tags no formato 'publish-*'
# Exemplo: git tag publish-v17 && git push origin publish-v17

name: .NET + NuGet

on:
  push:
    tags:
      - 'publish-*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Maxsys.Core.slnx

      - name: Build (Release)
        run: dotnet build Maxsys.Core.slnx -c Release --no-restore

      # Empacota somente os projetos de src/ (tests/ fica de fora).
      # As versões vêm do <Version> de cada .csproj.
      - name: Pack
        run: |
          shopt -s globstar
          for proj in src/**/*.csproj; do
            dotnet pack "$proj" -c Release --no-build -o out
          done

      - name: Push para o NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source ${{ secrets.NUGET_SERVER }} --skip-duplicate
