# Publicação de pacotes NuGet via Trusted Publishing (OIDC, sem API key armazenada)
# Requer policy de Trusted Publishing no nuget.org apontando para este repo + este arquivo de workflow.
# Dispara ao criar tags no formato 'publish-*'
# Exemplo: git tag publish-v17 && git push origin publish-v17

name: .NET + NuGet

on:
  push:
    tags:
      - 'publish-*'

permissions:
  contents: read
  id-token: write # necessário p/ OIDC (Trusted Publishing)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Maxsys.Core.slnx

      - name: Build (Release)
        run: dotnet build Maxsys.Core.slnx -c Release --no-restore

      # Empacota somente os projetos de src/ (tests/ fica de fora).
      # As versões vêm do <Version> de cada .csproj.
      - name: Pack
        run: |
          shopt -s globstar
          for proj in src/**/*.csproj; do
            dotnet pack "$proj" -c Release --no-build -o out
          done

      # Troca o token OIDC do job por uma API key temporária (~1h) do nuget.org.
      # NUGET_USER = nome de perfil no nuget.org (não é e-mail).
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push para o NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
